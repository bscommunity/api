openapi: "3.1.0"
info:
  title: "bscm API"
  description: "Beatstar Community Manager API for managing charts, users, and authentication"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080"
    description: "Local development server"
  - url: "https://api-cyb1.onrender.com/"
    description: "Production server"
paths:
  /:
    get:
      summary: "Get API welcome message"
      description: "Returns a welcome message for the bscm API, e.g. serves static content like `/static/index.html`"
      responses:
        "200":
          description: "OK"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "Hello to the bscm API!"
  /auth/google/link:
    post:
      summary: "Link Google OAuth account"
      description: "Links a user's account with Google OAuth authentication"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
        required: true
      responses:
        "200":
          description: "Successfully linked Google account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthResult"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidScope:
                  value: "Google user must have a valid scope"
                InvalidUserId:
                  value: "Invalid user ID"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  value: "Unauthorized access"
  /auth/google/unlink:
    post:
      summary: "Unlink Google OAuth account"
      description: "Removes the Google OAuth link from a user's account"
      responses:
        "200":
          description: "Successfully unlinked Google account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map_String"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidUserId:
                  value: "Invalid user ID"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  value: "Unauthorized access"
  /auth/discord:
    post:
      summary: "User authentication"
      description: "Authenticates a user and returns an access token"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
        required: true
      responses:
        "200":
          description: "Successfully authenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Map_String"
  /charts:
    get:
      summary: "Get all charts"
      description: "Retrieve all charts with optional filtering and pagination. Handles both authenticated and guest users"
      parameters:
        - name: "query"
          in: "query"
          description: "Search query to filter charts by name or content"
          required: false
          schema:
            type: "string"
        - name: "difficulties"
          in: "query"
          description: "Filter by difficulty levels"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum: ["NORMAL", "HARD", "EXTREME", "EXPERT"]
        - name: "genres"
          in: "query"
          description: "Filter by music genres"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum: ["HIP_HOP", "POP", "RNB", "ROCK", "DANCE", "ALTERNATIVE", "CLASSICAL"]
        - name: "sortBy"
          in: "query"
          description: "Sort criteria for the results"
          required: false
          schema:
            type: "string"
            enum: ["latest", "downloads", "name", "artist"]
        - name: "limit"
          in: "query"
          description: "Maximum number of results to return"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        - name: "offset"
          in: "query"
          description: "Number of results to skip for pagination"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
        - name: "ids"
          in: "query"
          description: "Specific chart IDs to retrieve"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
      responses:
        "200":
          description: "Successfully retrieved charts"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Chart"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  value: "Unauthorized access"
    post:
      summary: "Create a new chart"
      description: "Creates a new Beat Saber chart with associated bundle file"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chartData:
                  type: string
                  description: "JSON data for the chart metadata"
                bundle:
                  type: string
                  format: binary
                  description: "Chart bundle file (.zip)"
      responses:
        "201":
          description: "Chart created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                UploadFailed:
                  value: "Failed to upload bundle"
                MissingData:
                  value: "Chart data or bundle missing"
  /charts/{id}:
    get:
      summary: "Get chart by ID"
      description: "Retrieve a specific chart by its unique identifier"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Chart found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  value: "Unauthorized access"
        "404":
          description: "Chart not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotFound:
                  value: "Chart not found"
    put:
      summary: "Update an existing chart"
      description: "Updates chart metadata and properties"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChartRequest"
        required: true
      responses:
        "200":
          description: "Chart updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
        "404":
          description: "Chart not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete a chart"
      description: "Permanently removes a chart and all its associated data"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Chart deleted successfully"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
        "404":
          description: "Chart not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NotFound:
                  value: "Chart not found"
  /charts/{id}/contributors:
    get:
      summary: "Get chart contributors"
      description: "Retrieve all contributors for a specific chart"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Contributors retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "string"
                  format: "uuid"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
    post:
      summary: "Add contributors to chart"
      description: "Adds one or more contributors to a chart with specified roles"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContributorRequest"
        required: true
      responses:
        "200":
          description: "Contributors added successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Contributor"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
  /charts/{id}/contributors/{userId}:
    put:
      summary: "Update contributor roles"
      description: "Updates the roles of a specific contributor on a chart"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
        - name: "userId"
          in: "path"
          description: "Unique user identifier"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContributorRequest"
        required: true
      responses:
        "200":
          description: "Contributor roles updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contributor"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
    delete:
      summary: "Remove contributor from chart"
      description: "Removes a contributor from a chart"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
        - name: "userId"
          in: "path"
          description: "Unique user identifier"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Contributor removed successfully"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
  /charts/{id}/issues:
    post:
      summary: "Add issue to chart"
      description: "Reports a known issue with a specific chart"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnownIssue"
        required: true
      responses:
        "201":
          description: "Issue reported successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnownIssue"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
  /charts/{id}/issues/{issueId}:
    delete:
      summary: "Remove chart issue"
      description: "Removes a reported issue from a chart"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
        - name: "issueId"
          in: "path"
          description: "Unique issue identifier"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Issue removed successfully"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
  /charts/{chartId}/versions:
    post:
      summary: "Add version to chart"
      description: "Creates a new version of an existing chart"
      parameters:
        - name: "chartId"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bundle:
                  type: string
                  format: binary
                  description: "Chart bundle file (.zip)"
      responses:
        "201":
          description: "Version created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                UploadFailed:
                  value: "Failed to upload bundle"
  /charts/analytics/{id}:
    post:
      summary: "Track chart analytics"
      description: "Records analytics events for chart usage (downloads, plays, etc.)"
      parameters:
        - name: "id"
          in: "path"
          description: "Unique chart identifier"
          required: true
          schema:
            type: "string"
        - name: "type"
          in: "query"
          description: "Type of analytics event to track"
          required: false
          schema:
            type: "string"
            enum: ["download", "play", "view"]
      responses:
        "200":
          description: "Analytics recorded successfully"
          content:
            application/json:
              schema:
                type: "boolean"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  value: "Unauthorized access"
  /charts/latest-versions:
    get:
      summary: "Get latest chart versions"
      description: "Retrieve the latest versions of charts by their IDs"
      parameters:
        - name: "chartIds"
          in: "query"
          description: "Comma-separated list of chart IDs"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Latest versions retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Version"
  /charts/suggestions:
    get:
      summary: "Get chart suggestions"
      description: "Get suggested chart names or search autocomplete results"
      parameters:
        - name: "query"
          in: "query"
          description: "Partial search query for suggestions"
          required: false
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          description: "Maximum number of suggestions to return"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: "Suggestions retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "string"
  /charts/versions/{versionId}:
    delete:
      summary: "Delete chart version"
      description: "Removes a specific version from a chart"
      parameters:
        - name: "versionId"
          in: "path"
          description: "Unique version identifier"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Version deleted successfully"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidId:
                  value: "Invalid or missing ID"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                DeleteFailed:
                  value: "Failed to delete version bundle"
  /health:
    get:
      summary: "Health check"
      description: "Returns the current health status of the API"
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
  /refresh:
    post:
      summary: "Refresh bundle urls"
      description: "Endpoint for refreshing bundle urls from charts"
      parameters:
        - name: "X-RateLimit-Remaining"
          in: "header"
          description: "Number of requests remaining in the current window"
          required: false
          schema:
            type: "integer"
        - name: "X-RateLimit-Reset-After"
          in: "header"
          description: "Seconds until the rate limit window resets"
          required: false
          schema:
            type: "number"
        - name: "Retry-After"
          in: "header"
          description: "Seconds to wait before making another request"
          required: false
          schema:
            type: "number"
      responses:
        "200":
          description: "Bundle urls refreshed"
          content:
            text/plain:
              schema:
                type: "string"
  /status:
    get:
      summary: "API status"
      description: "Returns the current operational status of the API"
      responses:
        "200":
          description: "API status information"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: string
                    example: "operational"
                  version:
                    type: string
                    example: "1.0.0"
  /users:
    get:
      summary: "Get all users"
      description: "Retrieve all users with optional search filtering"
      parameters:
        - name: "search"
          in: "query"
          description: "Search term to filter users by username or email"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Users retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: "Create a new user"
      description: "Creates a new user account in the system"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    get:
      summary: "Get user by ID"
      description: "Retrieve a specific user by their Discord ID"
      parameters:
        - name: "id"
          in: "path"
          description: "User's Discord ID"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: "Update user"
      description: "Updates an existing user's information"
      parameters:
        - name: "id"
          in: "path"
          description: "User's Discord ID"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      summary: "Delete user"
      description: "Permanently removes a user from the system"
      parameters:
        - name: "id"
          in: "path"
          description: "User's Discord ID"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "User deleted successfully"
          content:
            text/plain:
              schema:
                type: "string"
              examples:
                Success:
                  value: "User deleted successfully"
  /users/hello:
    get:
      summary: "User greeting"
      description: "Returns a greeting message for authenticated users"
      responses:
        "200":
          description: "Greeting message"
          content:
            text/plain:
              schema:
                type: "string"
components:
  schemas:
    ErrorResponse:
      type: "object"
      description: "Standard error response format"
      properties:
        message:
          type: "string"
          description: "Human-readable error message"
        code:
          type: "string"
          description: "Error code for programmatic handling"
        timestamp:
          type: "string"
          description: "ISO 8601 timestamp of when the error occurred"
        path:
          type: "string"
          nullable: true
          description: "API path where the error occurred"
        details:
          type: "string"
          nullable: true
          description: "Additional error details"
      required:
        - "message"
        - "code"
        - "timestamp"
    AuthRequest:
      type: "object"
      description: "Authentication request payload"
      properties:
        code:
          type: "string"
          description: "OAuth authorization code"
      required:
        - "code"
    Map:
      type: "object"
      description: "Generic map object"
      properties: { }
    Map_String:
      type: "string"
      description: "String map representation"
    OAuthResult:
      type: "object"
      description: "OAuth authentication result"
      properties:
        scope:
          type: "string"
          description: "Granted OAuth scope"
      required:
        - "scope"
    Account:
      type: "object"
      description: "User's external account information"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Unique account identifier"
        provider:
          type: "string"
          description: "OAuth provider name (e.g., 'google', 'discord')"
        refreshToken:
          type: "string"
          nullable: true
          description: "OAuth refresh token"
        accessToken:
          type: "string"
          nullable: true
          description: "OAuth access token"
        expiresAt:
          type: "string"
          format: "date"
          nullable: true
          description: "Token expiration date"
        tokenType:
          type: "string"
          nullable: true
          description: "Token type (usually 'Bearer')"
        scope:
          type: "string"
          nullable: true
          description: "OAuth scope granted"
        idToken:
          type: "string"
          nullable: true
          description: "OAuth ID token"
        sessionState:
          type: "string"
          nullable: true
          description: "OAuth session state"
      required:
        - "id"
        - "provider"
    User:
      type: "object"
      description: "User account information"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Unique user identifier"
        username:
          type: "string"
          description: "User's display name"
        email:
          type: "string"
          format: "email"
          description: "User's email address"
        imageUrl:
          type: "string"
          nullable: true
          description: "URL to user's profile image"
        discordId:
          type: "string"
          description: "User's Discord ID"
        createdAt:
          type: "string"
          format: "date"
          description: "Account creation date"
        accounts:
          type: "array"
          nullable: true
          description: "Linked external accounts"
          items:
            $ref: "#/components/schemas/Account"
      required:
        - "id"
        - "username"
        - "email"
        - "discordId"
        - "createdAt"
    AuthResult:
      type: "object"
      description: "Successful authentication result"
      properties:
        token:
          type: "string"
          description: "JWT access token"
        user:
          $ref: "#/components/schemas/User"
      required:
        - "token"
        - "user"
    StreamingLink:
      type: "object"
      description: "Link to song on streaming platforms"
      properties:
        platform:
          type: "string"
          description: "Streaming platform identifier"
          enum:
            - "SPOTIFY"
            - "APPLE_MUSIC"
            - "YOUTUBE_MUSIC"
            - "DEEZER"
            - "TIDAL"
            - "AMAZON_MUSIC"
            - "SOUNDCLOUD"
            - "LAST_FM"
        url:
          type: "string"
          format: "uri"
          description: "Direct URL to the song on the platform"
      required:
        - "platform"
        - "url"
    KnownIssue:
      type: "object"
      description: "Known issue with a chart"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Unique issue identifier"
        description:
          type: "string"
          description: "Description of the issue"
        createdAt:
          type: "string"
          format: "date"
          description: "Date when the issue was reported"
      required:
        - "id"
        - "description"
        - "createdAt"
    Version:
      type: "object"
      description: "Specific version of a Beat Saber chart"
      properties:
        id:
          type: "string"
          description: "Unique version identifier"
        chartId:
          type: "string"
          description: "Parent chart identifier"
        index:
          type: "integer"
          format: "int32"
          description: "Version number/index"
        duration:
          type: "number"
          format: "float"
          description: "Song duration in seconds"
        notesAmount:
          type: "integer"
          format: "int32"
          description: "Total number of notes in the chart"
        effectsAmount:
          type: "integer"
          format: "int32"
          description: "Number of special effects in the chart"
        bpm:
          type: "integer"
          format: "int32"
          description: "Beats per minute of the song"
        difficulty:
          type: "string"
          description: "Chart difficulty level"
          enum:
            - "NORMAL"
            - "HARD"
            - "EXTREME"
            - "EXPERT"
        isDeluxe:
          type: "boolean"
          description: "Whether this is a deluxe version with extra features"
        isExplicit:
          type: "boolean"
          description: "Whether the song contains explicit content"
        bundleUrl:
          type: "string"
          format: "uri"
          description: "URL to download the chart bundle"
        previewUrl:
          type: "string"
          format: "uri"
          nullable: true
          description: "URL to audio preview of the song"
        downloadsAmount:
          type: "integer"
          format: "int32"
          default: 0
          description: "Number of times this version has been downloaded"
        knownIssues:
          type: "array"
          description: "List of known issues with this version"
          items:
            $ref: "#/components/schemas/KnownIssue"
        publishedAt:
          type: "string"
          format: "date"
          description: "Date when this version was published"
      required:
        - "id"
        - "chartId"
        - "index"
        - "duration"
        - "notesAmount"
        - "effectsAmount"
        - "bpm"
        - "difficulty"
        - "isDeluxe"
        - "isExplicit"
        - "bundleUrl"
        - "downloadsAmount"
        - "knownIssues"
        - "publishedAt"
    SimplifiedUser:
      type: "object"
      description: "Simplified user information for public display"
      properties:
        id:
          type: "string"
          description: "Unique user identifier"
        username:
          type: "string"
          description: "User's display name"
        imageUrl:
          type: "string"
          nullable: true
          description: "URL to user's profile image"
      required:
        - "id"
        - "username"
    Contributor:
      type: "object"
      description: "Chart contributor information"
      properties:
        user:
          $ref: "#/components/schemas/SimplifiedUser"
        chartId:
          type: "string"
          description: "Chart this user contributed to"
        roles:
          type: "array"
          description: "Roles this contributor had in creating the chart"
          items:
            type: "string"
            enum:
              - "AUTHOR"
              - "CHART"
              - "AUDIO"
              - "REVISION"
              - "EFFECTS"
              - "SYNC"
              - "GAMEPLAY"
        joinedAt:
          type: "string"
          format: "date"
          description: "Date when the contributor joined the chart project"
      required:
        - "user"
        - "chartId"
        - "roles"
        - "joinedAt"
    Chart:
      type: "object"
      description: "Beat Saber chart with all associated metadata"
      properties:
        id:
          type: "string"
          description: "Unique chart identifier"
        shareId:
          type: "string"
          description: "Public sharing identifier"
        artist:
          type: "string"
          description: "Song artist name"
        track:
          type: "string"
          description: "Song title"
        album:
          type: "string"
          nullable: true
          description: "Album name (if applicable)"
        genre:
          type: "string"
          nullable: true
          description: "Music genre classification"
          enum:
            - "HIP_HOP"
            - "POP"
            - "RNB"
            - "ROCK"
            - "DANCE"
            - "ALTERNATIVE"
            - "CLASSICAL"
        coverUrl:
          type: "string"
          format: "uri"
          description: "URL to the chart's cover image"
        trackUrls:
          type: "array"
          description: "Links to the song on various streaming platforms"
          items:
            $ref: "#/components/schemas/StreamingLink"
        trackPreviewUrl:
          type: "string"
          format: "uri"
          nullable: true
          description: "URL to a preview of the song"
        isFeatured:
          type: "boolean"
          description: "Whether this chart is featured on the platform"
        versions:
          type: "array"
          description: "All versions of this chart"
          items:
            $ref: "#/components/schemas/Version"
        contributors:
          type: "array"
          description: "People who contributed to creating this chart"
          items:
            $ref: "#/components/schemas/Contributor"
        downloadsSum:
          type: "integer"
          format: "int32"
          default: 0
          description: "Total downloads across all versions"
        latestVersion:
          nullable: true
          description: "The most recent version of this chart"
          $ref: "#/components/schemas/Version"
        latestPublishedAt:
          type: "string"
          format: "date"
          description: "Date when the latest version was published"
      required:
        - "id"
        - "shareId"
        - "artist"
        - "track"
        - "coverUrl"
        - "trackUrls"
        - "isFeatured"
        - "versions"
        - "contributors"
        - "downloadsSum"
        - "latestPublishedAt"
    UpdateChartRequest:
      type: "object"
      description: "Request payload for updating chart information"
      properties:
        artist:
          type: "string"
          nullable: true
          description: "New artist name"
        track:
          type: "string"
          nullable: true
          description: "New track title"
        album:
          type: "string"
          nullable: true
          description: "New album name"
        coverUrl:
          type: "string"
          format: "uri"
          nullable: true
          description: "New cover image URL"
        difficulty:
          type: "string"
          nullable: true
          description: "New difficulty level"
          enum:
            - "NORMAL"
            - "HARD"
            - "EXTREME"
            - "EXPERT"
        genre:
          type: "string"
          nullable: true
          description: "New genre classification"
          enum:
            - "HIP_HOP"
            - "POP"
            - "RNB"
            - "ROCK"
            - "DANCE"
            - "ALTERNATIVE"
            - "CLASSICAL"
        isDeluxe:
          type: "boolean"
          nullable: true
          description: "Whether this should be marked as deluxe"
        isExplicit:
          type: "boolean"
          nullable: true
          description: "Whether this contains explicit content"
        isFeatured:
          type: "boolean"
          nullable: true
          description: "Whether this should be featured"
        isPublic:
          type: "boolean"
          nullable: true
          description: "Whether this chart should be publicly visible"
    SimplifiedContributor:
      type: "object"
      description: "Simplified contributor information for requests"
      properties:
        userId:
          type: "string"
          format: "uuid"
          description: "User identifier"
        roles:
          type: "array"
          description: "Roles to assign to this contributor"
          items:
            type: "string"
            enum:
              - "AUTHOR"
              - "CHART"
              - "AUDIO"
              - "REVISION"
              - "EFFECTS"
              - "SYNC"
              - "GAMEPLAY"
      required:
        - "userId"
        - "roles"
    CreateContributorRequest:
      type: "object"
      description: "Request to add contributors to a chart"
      properties:
        contributors:
          type: "array"
          description: "List of contributors to add"
          items:
            $ref: "#/components/schemas/SimplifiedContributor"
      required:
        - "contributors"
    UpdateContributorRequest:
      type: "object"
      description: "Request to update a contributor's roles"
      properties:
        roles:
          type: "array"
          description: "New roles for the contributor"
          items:
            type: "string"
            enum:
              - "AUTHOR"
              - "CHART"
              - "AUDIO"
              - "REVISION"
              - "EFFECTS"
              - "SYNC"
              - "GAMEPLAY"
      required:
        - "roles"
    CreateUserRequest:
      type: "object"
      description: "Request to create a new user"
      properties:
        username:
          type: "string"
          description: "Desired username"
        email:
          type: "string"
          format: "email"
          description: "User's email address"
        discordId:
          type: "string"
          description: "User's Discord ID"
        imageUrl:
          type: "string"
          format: "uri"
          nullable: true
          description: "Profile image URL"
      required:
        - "username"
        - "email"
        - "discordId"
    UpdateUserRequest:
      type: "object"
      description: "Request to update user information"
      properties:
        username:
          type: "string"
          nullable: true
          description: "New username"
        email:
          type: "string"
          format: "email"
          nullable: true
          description: "New email address"
        discordId:
          type: "string"
          nullable: true
          description: "New Discord ID"
        imageUrl:
          type: "string"
          format: "uri"
          nullable: true
          description: "New profile image URL"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token obtained from the /auth/login endpoint"

security:
  - BearerAuth: []