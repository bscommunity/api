ktor:
  application:
    modules:
      - org.bscm.ApplicationKt.module
  deployment:
    host: "0.0.0.0"
    port: "$PORT:8080"
storage:
  driverClassName: "org.postgresql.Driver"
  jdbcURL: $POSTGRES_URL
  user: $POSTGRES_USER
  password: $POSTGRES_PASSWORD
jwt:
  secret: $JWT_SECRET
  realm: "bs-community"
hmac:
  secret: $HMAC_SECRET
refresh:
  secret: $REFRESH_SECRET
discord:
  clientId: $DISCORD_CLIENT_ID
  clientSecret: $DISCORD_CLIENT_SECRET
  redirectUri: $DISCORD_REDIRECT_URI
  botToken: $DISCORD_BOT_TOKEN
  publicKey: $DISCORD_PUBLIC_KEY
google:
  clientId: $GOOGLE_CLIENT_ID
  clientSecret: $GOOGLE_CLIENT_SECRET
  redirectUri: $GOOGLE_REDIRECT_URI
lastfm:
  apiKey: $LASTFM_API_KEY
workshop:
  guildId: $WORKSHOP_GUILD_ID # optional (dev) for instant commands
  channelId: $WORKSHOP_CHANNEL_ID
  webhookId: $WORKSHOP_WEBHOOK_ID
  webhookToken: $WORKSHOP_WEBHOOK_TOKEN
status:
  url: $STATUS_URL
assets:
  publicBucket: $ASSETS_PUBLIC_BUCKET
  publicBaseUrl: $ASSETS_PUBLIC_BASE_URL
  supabase:
    url: $ASSETS_PUBLIC_BASE_URL
    serviceKey: $SUPABASE_SERVICE_KEY